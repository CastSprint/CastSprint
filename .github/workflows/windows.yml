name: Windows receiver
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build (Debug + Release)
        run: |
          cmake --build build --config Debug --parallel
          cmake --build build --config Release --parallel
      - name: Test (protocol + startup smoke test, WARP fallback on runners without GPU)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package Standalone Portable Release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\windows\CastSprint-v0.2.0-Windows-x64
          Copy-Item build\apps\windows\Release\castsprint_receiver.exe dist\windows\CastSprint-v0.2.0-Windows-x64\
          Copy-Item README.md dist\windows\CastSprint-v0.2.0-Windows-x64\
          Copy-Item LICENSE dist\windows\CastSprint-v0.2.0-Windows-x64\
          New-Item -ItemType Directory -Force -Path dist\windows\CastSprint-v0.2.0-Windows-x64\docs
          Copy-Item docs\OBS_GUIDE.md dist\windows\CastSprint-v0.2.0-Windows-x64\docs\
          Copy-Item docs\USB_CONNECTION.md dist\windows\CastSprint-v0.2.0-Windows-x64\docs\
          Copy-Item docs\WIFI_CONNECTION.md dist\windows\CastSprint-v0.2.0-Windows-x64\docs\
          Copy-Item docs\TROUBLESHOOTING.md dist\windows\CastSprint-v0.2.0-Windows-x64\docs\
          Compress-Archive -Path dist\windows\CastSprint-v0.2.0-Windows-x64\* -DestinationPath dist\windows\CastSprint-v0.2.0-Windows-x64.zip -Force
          Get-FileHash dist\windows\CastSprint-v0.2.0-Windows-x64.zip -Algorithm SHA256 | Out-File dist\windows\CastSprint-v0.2.0-Windows-x64.zip.sha256

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            & $iscc installer\castsprint_installer.iss
            if (Test-Path build\installer\CastSprint_Setup_v0.2.0_Beta_x64.exe) {
              Copy-Item build\installer\CastSprint_Setup_v0.2.0_Beta_x64.exe dist\windows\
              Get-FileHash dist\windows\CastSprint_Setup_v0.2.0_Beta_x64.exe -Algorithm SHA256 | Out-File dist\windows\CastSprint_Setup_v0.2.0_Beta_x64.exe.sha256
            }
          } else {
            Write-Host "ISCC not found, standalone zip generated."
          }

      - name: Upload Windows Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CastSprint-Windows-v0.2.0
          path: |
            dist/windows/*.zip*
            dist/windows/*.exe*
          retention-days: 7

