name: Linux Receiver

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build & Test Linux Receiver
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config

      - name: Configure CMake (Release)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build CastSprint Linux Receiver & Native Libs
        run: cmake --build build --parallel

      - name: Run Tests & Application Smoke Test
        run: |
          ctest --test-dir build --output-on-failure
          ./build/apps/linux/castsprint_receiver_linux --smoke-test

      - name: Package Linux Standalone Distribution
        run: |
          mkdir -p dist/linux/CastSprint-v0.2.0-Linux-x86_64/bin
          mkdir -p dist/linux/CastSprint-v0.2.0-Linux-x86_64/share/applications
          mkdir -p dist/linux/CastSprint-v0.2.0-Linux-x86_64/share/icons/hicolor/256x256/apps
          mkdir -p dist/linux/CastSprint-v0.2.0-Linux-x86_64/docs

          cp build/apps/linux/castsprint_receiver_linux dist/linux/CastSprint-v0.2.0-Linux-x86_64/bin/
          chmod +x dist/linux/CastSprint-v0.2.0-Linux-x86_64/bin/castsprint_receiver_linux
          cp apps/linux/castsprint.desktop dist/linux/CastSprint-v0.2.0-Linux-x86_64/share/applications/
          cp assest/logo.png dist/linux/CastSprint-v0.2.0-Linux-x86_64/share/icons/hicolor/256x256/apps/castsprint.png
          cp README.md LICENSE dist/linux/CastSprint-v0.2.0-Linux-x86_64/
          cp docs/OBS_GUIDE.md docs/USB_CONNECTION.md docs/WIFI_CONNECTION.md docs/TROUBLESHOOTING.md dist/linux/CastSprint-v0.2.0-Linux-x86_64/docs/

          tar -czvf dist/linux/CastSprint-v0.2.0-Linux-x86_64.tar.gz -C dist/linux CastSprint-v0.2.0-Linux-x86_64
          sha256sum dist/linux/CastSprint-v0.2.0-Linux-x86_64.tar.gz > dist/linux/CastSprint-v0.2.0-Linux-x86_64.tar.gz.sha256

      - name: Upload Linux Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CastSprint-Linux-v0.2.0
          path: |
            dist/linux/*.tar.gz*
          retention-days: 7
