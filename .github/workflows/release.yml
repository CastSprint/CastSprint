name: Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or branch to release
        required: true
        default: main

permissions:
  actions: read
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      exists: ${{ steps.meta.outputs.exists }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - id: meta
        name: Resolve immutable release identity
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          version="$(python3 -c 'import plistlib; print(plistlib.load(open("apps/macos/CastSprintMac/Info.plist", "rb"))["CFBundleShortVersionString"])')"
          android_version="$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' apps/android/app/build.gradle.kts)"
          ios_version="$(python3 -c 'import plistlib; print(plistlib.load(open("apps/ios/CastSprintIOS/Info.plist", "rb"))["CFBundleShortVersionString"])')"
          extension_version="$(python3 -c 'import plistlib; print(plistlib.load(open("apps/ios/LegacyBroadcastExtension/Info.plist", "rb"))["CFBundleShortVersionString"])')"
          tag="v${version}"
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: ${version}" >&2
            exit 1
          fi
          if [[ "${android_version}" != "${version}" || "${ios_version}" != "${version}" || "${extension_version}" != "${version}" ]]; then
            echo "Platform versions do not match macOS ${version}: Android=${android_version}, iOS=${ios_version}, extension=${extension_version}" >&2
            exit 1
          fi
          exists=false
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            exists=true
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "exists=${exists}" >> "$GITHUB_OUTPUT"
          echo "Release candidate ${tag} at ${sha}; existing tag: ${exists}"
      - name: Require successful CI gate for exact commit
        if: steps.meta.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          set -euo pipefail
          conclusion="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs" \
            --jq '[.check_runs[] | select(.name == "CI Complete")][0].conclusion // "missing"')"
          test "$conclusion" = "success" || {
            echo "Exact commit $SHA does not have a successful CI Complete check (found: $conclusion)." >&2
            exit 1
          }

  macos:
    name: macOS artifact
    needs: prepare
    if: needs.prepare.outputs.exists == 'false'
    runs-on: macos-14
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - name: Require production signing and notarization credentials
        env:
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          for value in CERTIFICATE CERTIFICATE_PASSWORD APPLE_ID APPLE_TEAM_ID APP_SPECIFIC_PASSWORD; do
            test -n "${!value:-}" || { echo "Missing required production secret: ${value}" >&2; exit 1; }
          done
      - name: Import Developer ID certificate
        env:
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/castsprint-signing.keychain-db"
          certificate="$RUNNER_TEMP/castsprint-developer-id.p12"
          password="$(openssl rand -hex 24)"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -n 1)"
          test -n "$identity" || { echo "Developer ID Application identity not found" >&2; exit 1; }
          echo "CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "SIGNING_CERTIFICATE=$certificate" >> "$GITHUB_ENV"
      - name: Build and package
        env:
          REQUIRE_DISTRIBUTION_SIGNING: "true"
        run: |
          (cd apps/macos/CastSprintMac && swift test --parallel)
          (cd apps/ios && swift test --parallel)
          ./scripts/package_macos.sh
      - name: Notarize, staple, and verify Gatekeeper acceptance
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          dmg="dist/macos/CastSprint-v${{ needs.prepare.outputs.version }}-macOS.dmg"
          xcrun notarytool submit "$dmg" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APP_SPECIFIC_PASSWORD" \
            --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature -vv "$dmg"
      - name: Remove ephemeral signing material
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi
          if [ -n "${SIGNING_CERTIFICATE:-}" ]; then
            rm -f "$SIGNING_CERTIFICATE"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: |
            dist/macos/CastSprint-v${{ needs.prepare.outputs.version }}-macOS.dmg
            dist/macos/CastSprint-v${{ needs.prepare.outputs.version }}-macOS.dmg.sha256
            dist/macos/CastSprint-v${{ needs.prepare.outputs.version }}-macOS-build.plist
          if-no-files-found: error

  android:
    name: Android artifact
    needs: prepare
    if: needs.prepare.outputs.exists == 'false'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: apps/android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --console=plain
      - name: Stage artifact
        run: |
          mkdir -p dist/release
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk "dist/release/CastSprint-Android-${{ needs.prepare.outputs.version }}-debug.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: dist/release/*
          if-no-files-found: error

  linux:
    name: Linux artifact
    needs: prepare
    if: needs.prepare.outputs.exists == 'false'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
      - name: Package
        run: |
          root="CastSprint-${{ needs.prepare.outputs.version }}-Linux-x86_64"
          mkdir -p "dist/release/${root}/bin" "dist/release/${root}/share/applications"
          cp build/apps/linux/castsprint_receiver_linux "dist/release/${root}/bin/"
          cp apps/linux/castsprint.desktop "dist/release/${root}/share/applications/"
          cp README.md LICENSE "dist/release/${root}/"
          tar -C dist/release -czf "dist/release/${root}.tar.gz" "${root}"
          rm -rf "dist/release/${root}"
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: dist/release/*
          if-no-files-found: error

  windows:
    name: Windows artifact
    needs: prepare
    if: needs.prepare.outputs.exists == 'false'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Build and test
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          cmake --build build --config Release --parallel
          ctest --test-dir build -C Release --output-on-failure
      - name: Package
        shell: pwsh
        run: |
          $root = "CastSprint-${{ needs.prepare.outputs.version }}-Windows-x64"
          New-Item -ItemType Directory -Force -Path "dist/release/$root" | Out-Null
          Copy-Item "build/apps/windows/Release/castsprint_receiver.exe" "dist/release/$root/"
          Copy-Item README.md, LICENSE "dist/release/$root/"
          Compress-Archive -Path "dist/release/$root/*" -DestinationPath "dist/release/$root.zip" -Force
          Remove-Item -Recurse -Force "dist/release/$root"
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: dist/release/*
          if-no-files-found: error

  publish:
    name: Tag and publish GitHub Release
    needs: [prepare, macos, android, linux, windows]
    if: >-
      always() && needs.prepare.result == 'success' && needs.prepare.outputs.exists == 'false' &&
      needs.macos.result == 'success' && needs.android.result == 'success' &&
      needs.linux.result == 'success' && needs.windows.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist/release
          merge-multiple: true
      - name: Generate release checksums
        working-directory: dist/release
        run: |
          rm -f SHA256SUMS
          find . -maxdepth 1 -type f ! -name '*.sha256' ! -name 'SHA256SUMS' -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  \./#  #' > SHA256SUMS
          cat SHA256SUMS
      - name: Create immutable tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          gh release create "$TAG" dist/release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --generate-notes \
            --title "CastSprint $TAG"

  already-released:
    name: Release already exists
    needs: prepare
    if: needs.prepare.outputs.exists == 'true'
    runs-on: ubuntu-24.04
    steps:
      - run: echo "${{ needs.prepare.outputs.tag }} already exists; no tag or assets were overwritten."
