[package]
name = "castsprint-desktop"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "CastSprint Native Desktop Receiver for Windows and Linux"

[dependencies]
castsprint-core = { path = "../castsprint-core" }
winit = "0.30.13"
softbuffer = "0.4.8"
cpal = { version = "0.18.2", optional = true }

[features]
default = []
audio = ["dep:cpal"]

[[bin]]
name = "castsprint-desktop"
path = "src/main.rs"
